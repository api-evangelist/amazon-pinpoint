cardinality_notes:
  - An Application has at most one EventStream.
  - >-
    Message templates and recommender configurations are ACCOUNT-scoped, not application-scoped -
    the only two entities that do not hang off an Application.
  - >-
    A User is not a resource. It exists only as the UserId shared by several endpoints, which is
    why SendUsersMessages fans out and GetUserEndpoints reads back.
  - >-
    Everything is region-scoped. The same Application id does not exist in another region; see
    conventions/amazon-pinpoint-conventions.yml.
