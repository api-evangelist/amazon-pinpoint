specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Amazon Pinpoint
providerId: amazon-pinpoint
created: '2026-05-04'
modified: '2026-08-13'
generated: '2026-08-13'
method: searched
source: https://aws.amazon.com/pinpoint/pricing/
provenance_note: >-
  Replaces the 2026-05-04 bulk-sweep scaffold, which invented Free / Professional / Enterprise tiers
  with TBD prices. Amazon Pinpoint has no tiers at all - it is metered pay-as-you-go with a
  perpetual free allowance on four meters. Every figure below is read from the AWS pricing page on
  2026-08-13.
tags:
  - AWS
  - Messaging
  - Marketing
  - Pricing
  - Pay As You Go
description: >-
  Amazon Pinpoint is priced pay-as-you-go with no minimum charge, no contract and no plan tiers.
  Billing is metered per Monthly Targeted Audience endpoint, per application event, per message
  sent by channel, and per optional add-on (deliverability dashboard, dedicated IPs). SMS, MMS,
  voice, OTP and PhoneNumberValidate are billed on the separate AWS End User Messaging pricing
  page. Every AWS account gets the same free allowance every month, not just in a trial window.
plan_count: 1
pricing_model: metered-pay-as-you-go
currency: USD
plans:
  - id: amazon-pinpoint-pay-as-you-go
    name: Pay-as-you-go
    type: metered
    billing_period: monthly
    description: >-
      The only plan. No minimum charge, no contract, no negotiated tier published. A perpetual
      monthly free allowance applies to Monthly Targeted Audience, application events, push
      notifications and in-app message requests; usage above it is billed per unit.
    free_allowance:
      - {label: Monthly Targeted Audience, name: mta_endpoints, metric: endpoints, limit: 5000, timeFrame: month}
      - {label: Application events, name: events, metric: events, limit: 100000000, timeFrame: month}
      - {label: Push notifications, name: push, metric: notifications, limit: 1000000, timeFrame: month}
      - {label: In-app message API requests, name: inapp_requests, metric: requests, limit: 15000, timeFrame: month}
    entries:
      - label: Monthly Targeted Audience
        description: Each endpoint targeted by a campaign or journey in the month, above the 5,000 free
        name: mta_endpoints
        type: metered
        metric: endpoints
        unit: 1
        price: '0.0012'
        currency: USD
        timeFrame: month
      - label: Application events
        description: Events ingested through PutEvents, above the 100,000,000 free
        name: events
        type: metered
        metric: events
        unit: 1
        price: '0.000001'
        currency: USD
        timeFrame: month
      - label: Email
        description: Each email sent
        name: email
        type: metered
        metric: emails
        unit: 1
        price: '0.0001'
        currency: USD
      - label: Push notifications
        description: Each push notification above the 1,000,000 free
        name: push
        type: metered
        metric: notifications
        unit: 1
        price: '0.000001'
        currency: USD
        timeFrame: month
      - label: In-app messages
        description: Each in-app message API request above the 15,000 free
        name: inapp_requests
        type: metered
        metric: requests
        unit: 1
        price: '0.00011'
        currency: USD
        timeFrame: month
      - label: Deliverability dashboard
        description: Optional add-on
        name: deliverability_dashboard
        type: subscription
        metric: months
        unit: 1
        price: '1250.00'
        currency: USD
        timeFrame: month
      - label: Deliverability dashboard - additional domain monitoring
        name: deliverability_domain
        type: metered
        metric: domains
        unit: 1
        price: '25.00'
        currency: USD
        timeFrame: month
      - label: Deliverability dashboard - predictive inbox placement test
        name: deliverability_test
        type: metered
        metric: tests
        unit: 1
        price: '10.00'
        currency: USD
      - label: Dedicated IP address
        name: dedicated_ip
        type: metered
        metric: ip_addresses
        unit: 1
        price: '24.95'
        currency: USD
        timeFrame: month
    elements:
      - name: Self-serve AWS account signup
      - name: Public documentation and API reference
      - name: AWS Support plans purchased separately
      - name: AWS User Engagement SLA (99.9% monthly uptime)
      - name: Quota increases via Service Quotas, not via a plan upgrade
external_pricing:
  - channel: SMS, MMS, voice, OTP, PhoneNumberValidate
    url: https://aws.amazon.com/end-user-messaging/pricing/
    note: Billed under AWS End User Messaging, not on the Pinpoint pricing page.
availability_note: >-
  Amazon Pinpoint has been closed to new customers since 2025-05-20 and ends support 2026-10-30.
  These prices apply only to accounts that signed up before that date. See
  lifecycle/amazon-pinpoint-lifecycle.yml.
maintainers:
