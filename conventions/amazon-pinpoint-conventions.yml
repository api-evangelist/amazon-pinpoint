      in: query
      note: Used by 19 operations.
    - name: token
      in: query
      note: The v1 cursor parameter; used by 12 operations.
    - name: next-token
      in: query
      note: Used by 7 operations (the templates and recommenders surfaces).
  response_field: NextToken
  response_note: >-
    Paged responses wrap results in a *Response object whose Item array carries the page and whose
    NextToken carries the cursor for the next call. 13 response schemas expose NextToken, including
    CampaignsResponse, SegmentsResponse, JourneysResponse, TemplatesResponse, ImportJobsResponse
    and ExportJobsResponse.
  termination: NextToken is absent from the final page.
versioning:
  style: uri-path + service api version
  path_prefix: /v1
  api_version: '2016-12-01'
  detail: lifecycle/amazon-pinpoint-lifecycle.yml
resource_versioning:
  supported: true
  note: >-
    Campaigns, segments and message templates are themselves versioned resources. Writes accept
    create-new-version (query, 5 operations) and reads accept version; templates additionally
    expose ListTemplateVersions and UpdateTemplateActiveVersion. This is resource revisioning, not
    API versioning.
error_envelope:
  format: aws-json-exception
  rfc9457: false
  shape: >-
    A JSON body with a Message field, plus x-amzn-ErrorType identifying the exception class. The
    published contract names eight exception types; see errors/amazon-pinpoint-problem-types.yml.
  note: >-
    The harvested contract encodes error statuses as the aws2openapi placeholder codes 480-487
    rather than real HTTP statuses. The wire statuses are the ones in the AWS API reference and are
    recorded in the error catalog.
  detail: errors/amazon-pinpoint-problem-types.yml
rate_limit_signaling:
  headers: none
  note: >-
    Pinpoint publishes per-operation rate and burst quotas in requests per second but returns no
    RateLimit-*, X-RateLimit-* or Retry-After headers. Exhaustion surfaces as a
    TooManyRequestsException; a client learns its remaining budget only by being throttled.
    Backoff is the caller's responsibility - the AWS SDKs implement exponential backoff with
    jitter by default.
  exhaustion_error: TooManyRequestsException
  detail: rate-limits/amazon-pinpoint-rate-limits.yml
request_tracing:
  header: x-amzn-RequestId
  note: >-
    AWS services return a request id on every response and AWS Support asks for it when
    investigating. It is an AWS-platform convention rather than something the Pinpoint contract
    declares, so it does not appear in openapi/.
