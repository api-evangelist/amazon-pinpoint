authentication:
  style: aws-sigv4
  header: Authorization
  scheme_name: hmac
  signing_name: mobiletargeting
  note: >-
    AWS Signature Version 4 over the request, not a bearer token. The OpenAPI models it as an
    apiKey-in-header scheme because SigV4 has no native OpenAPI type; the real contract is a
    computed HMAC signature plus X-Amz-Date, X-Amz-Content-Sha256 and (for temporary credentials)
    X-Amz-Security-Token. Authorization is by IAM policy on mobiletargeting:* actions, not by scope.
  detail: authentication/amazon-pinpoint-authentication.yml
  scopes: none
  scopes_note: >-
    There is no OAuth surface. Permissions are IAM actions (mobiletargeting:CreateCampaign,
    mobiletargeting:SendMessages, ...), so scopes/ is deliberately absent rather than empty.
idempotency:
  supported: false
  header: null
  note: >-
    The Amazon Pinpoint API publishes no idempotency contract. There is no Idempotency-Key header,
    no ClientToken request field, and no idempotency language anywhere in the 855 KB source
    contract or the API reference. Retrying SendMessages or CreateCampaign after a timeout can
    duplicate the effect. This is a real gap for agent use, recorded rather than papered over.
  verified: >-
    grep of openapi/_original/amazon-pinpoint-openapi-original.yaml for idempoten|ClientToken
    returned zero matches on 2026-08-13.
pagination:
  style: opaque-cursor
  request_params:
