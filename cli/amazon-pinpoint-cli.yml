generated: '2026-08-13'
method: searched
source: https://docs.aws.amazon.com/cli/latest/reference/pinpoint/index.html
name: AWS CLI - pinpoint
binary: aws
namespace: aws pinpoint
official: true
description: >-
  Amazon Pinpoint has no dedicated CLI. Its command surface is the `pinpoint` service namespace
  inside the AWS CLI, generated one-to-one from the same 2016-12-01 service model that produced
  openapi/. Every command is the kebab-cased operationId.
version_note: >-
  AWS CLI v2 is the current line; v1 (pip-installable `awscli`) still carries the namespace. The
  binary is catalogued in packages/amazon-pinpoint-packages.yml.
install:
  - platform: macos
    method: signed package installer
    command: >-
      curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg" && sudo installer -pkg
      AWSCLIV2.pkg -target /
  - platform: linux
    method: zip installer
    command: >-
      curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip" && unzip
      awscliv2.zip && sudo ./aws/install
  - platform: windows
    method: msi
    command: msiexec.exe /i https://awscli.amazonaws.com/AWSCLIV2.msi
  - platform: any
    method: pip (v1 only)
    command: pip install awscli
auth:
  method: aws-sigv4 via configured IAM credentials
  setup: aws configure
  note: >-
    The CLI signs with SigV4 using the profile's credentials and requires --region, because Pinpoint
    has no global endpoint.
