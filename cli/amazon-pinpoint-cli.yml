key_flows:
  - name: Stand up a project and send
    steps:
      - aws pinpoint create-app --create-application-request Name=demo --region us-east-1
      - aws pinpoint update-email-channel --application-id <id> --email-channel-request Enabled=true,FromAddress=...,Identity=...
      - aws pinpoint send-messages --application-id <id> --message-request file://message.json
  - name: Build an audience and launch a campaign
    steps:
      - aws pinpoint create-segment --application-id <id> --write-segment-request file://segment.json
      - aws pinpoint create-campaign --application-id <id> --write-campaign-request file://campaign.json
      - aws pinpoint get-campaign --application-id <id> --campaign-id <cid>
  - name: Stream engagement events out
    steps:
      - aws pinpoint put-event-stream --application-id <id> --write-event-stream DestinationStreamArn=...,RoleArn=...
      - aws pinpoint get-event-stream --application-id <id>
divergence:
  note: >-
    The CLI exposes 122 commands; the harvested contract in openapi/ carries 119 operations. Three
    commands have no operation in the spec - get-journey-runs,
    get-journey-run-execution-metrics and get-journey-run-execution-activity-metrics - the journey
    run metrics that shipped 2023-04-25. The contract we hold is that far behind the live service.
  cli_only:
    - get-journey-runs
    - get-journey-run-execution-metrics
    - get-journey-run-execution-activity-metrics
lifecycle_note: >-
  The `aws pinpoint` namespace goes away with the service on 2026-10-30; `aws pinpoint-sms-voice-v2`
  (AWS End User Messaging) is the surface that continues.
