generated: '2026-08-13'
method: searched
source: >-
  Public package-registry metadata endpoints (registry.npmjs.org, pypi.org, rubygems.org,
  search.maven.org, api.nuget.org, proxy.golang.org, packagist.org) queried 2026-08-13, plus
  https://aws.amazon.com/tools/ and https://docs.aws.amazon.com/pinpoint/latest/developerguide/service_code_examples.html
note: >-
  Amazon Pinpoint has no standalone SDK. It is a service client inside the multi-service AWS SDK
  family, so each entry below is either the Pinpoint-specific client package (npm, Maven, NuGet,
  RubyGems, Go) or the umbrella SDK that carries the Pinpoint client (boto3/botocore for Python,
  aws/aws-sdk-php for PHP). Every entry is first-party AWS. Release dates are read from the
  registry metadata endpoint, not from prose.
packages:
  - language: javascript
    registry: npm
    name: '@aws-sdk/client-pinpoint'
    url: https://www.npmjs.com/package/@aws-sdk/client-pinpoint
    install: npm install @aws-sdk/client-pinpoint
    official: true
    version: 3.1109.0
    published: '2026-08-12'
    note: AWS SDK for JavaScript v3, Pinpoint client. Actively released on the AWS SDK train.
  - language: javascript
    registry: npm
    name: aws-sdk
    url: https://www.npmjs.com/package/aws-sdk
    install: npm install aws-sdk
    official: true
    version: 2.1693.0
    published: '2025-12-09'
    note: >-
      AWS SDK for JavaScript v2 (umbrella, includes Pinpoint). In maintenance mode - the latest
      release predates the v3 client by eight months, which is the decay signal, not a defect.
  - language: python
    registry: pypi
    name: boto3
    url: https://pypi.org/project/boto3/
    install: pip install boto3
    official: true
    version: 1.43.70
    published: '2026-08-12'
    note: AWS SDK for Python. Pinpoint is reached via boto3.client('pinpoint'); no separate package.
  - language: python
    registry: pypi
    name: botocore
    url: https://pypi.org/project/botocore/
    install: pip install botocore
    official: true
