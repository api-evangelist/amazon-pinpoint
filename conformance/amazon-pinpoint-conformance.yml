standards:
  - id: aws-sigv4
    conforms: true
    evidence: >-
      Every spec declares the `hmac` security scheme with x-amazon-apigateway-authtype awsSigv4 and
      the X-Amz-* signing parameters; the AWS General Reference documents the algorithm.
  - id: oauth2
    conforms: false
    evidence: No oauth2 securityScheme in any spec; authorization is IAM policy, not OAuth.
  - id: oidc
    conforms: false
    evidence: No openIdConnect securityScheme and no /.well-known/openid-configuration on any host (404/403).
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Errors are AWS JSON exceptions with a Message field and an x-amzn-ErrorType header; no
      application/problem+json media type appears in the contract.
  - id: rfc9116-security-txt
    conforms: true
    evidence: >-
      https://aws.amazon.com/.well-known/security.txt returns 200 with Policy, Contact,
      Preferred-Languages, Encryption and Expires fields. Saved at
      well-known/amazon-pinpoint-security.txt.
  - id: rfc8594-sunset-header
    conforms: false
    evidence: >-
      Amazon Pinpoint has a dated end of support (2026-10-30) but emits no Sunset or Deprecation
      response headers and marks no operation `deprecated` in the contract.
  - id: pagination-cursor
    conforms: true
    evidence: >-
      Opaque cursor pagination via page-size + token / next-token query parameters and a NextToken
      response field on 13 response schemas.
  - id: idempotency
    conforms: false
    evidence: >-
      No idempotency key header and no ClientToken field anywhere in the contract; write
      operations are not safely retryable.
  - id: json-api
    conforms: false
    evidence: Plain JSON resource representations; no JSON:API document structure.
  - id: odata
    conforms: false
  - id: scim2
    conforms: false
  - id: fhir-r4
    conforms: false
  - id: psd2
    conforms: false
  - id: fapi
    conforms: false
  - id: tls-1-2
    conforms: true
    evidence: >-
      HTTPS with TLS 1.2 or later required; TLS 1.0 support ended 2023-03-22. Live TLS probe of the
      AWS hosts recorded TLSv1.3 - see security/amazon-pinpoint-domain-security.yml.
  - id: rest-resource-oriented
    conforms: true
    evidence: >-
      119 operations across resource-oriented /v1/ paths using GET/POST/PUT/DELETE with unique
      operationIds; a real REST contract rather than an RPC action list.
  - id: openapi-3-0
    conforms: true
    evidence: >-
      openapi/_original/amazon-pinpoint-openapi-original.yaml is OpenAPI 3.0.0, converted from AWS's
      own pinpoint-2016-12-01 service model by aws2openapi. AWS itself does not publish OpenAPI.
  - id: asyncapi
    conforms: false
    evidence: >-
      Pinpoint has a real event surface (Kinesis/Firehose event streams plus custom-channel
      webhooks) but publishes no AsyncAPI document. See asyncapi/amazon-pinpoint-events.yml.
