finding: >-
  AWS ships no Amazon Pinpoint MCP server. The awslabs/mcp repository - AWS's official MCP
  distribution - carried 62 servers on 2026-08-13 and none of them is Pinpoint, End User Messaging,
  or messaging/engagement. There is therefore no MCP surface that exposes the Pinpoint operations in
  openapi/ as tools, and this file does not claim one. The tools[] list below is a DERIVED candidate
  set: what a Pinpoint MCP server would expose if someone built one from the published contract.
related_first_party_servers:
  - name: AWS Knowledge MCP Server
    scope: AWS documentation, regions and skills - NOT the Pinpoint API
    mode: remote
    endpoint: https://knowledge-mcp.global.api.aws/mcp
    auth: none
    verified: probed
    probed: '2026-08-13'
    http_status: 200
    tools:
      - aws___read_documentation
      - aws___search_documentation
      - aws___list_regions
      - aws___get_regional_availability
      - aws___retrieve_skill
    note: >-
      Anonymous tools/list returned 200 with five tools. It can read the Amazon Pinpoint docs pages
      for an agent, but it cannot call CreateCampaign or SendMessages. Recorded as context, not as
      a Pinpoint agent surface.
  - name: AWS API MCP Server
    scope: every AWS API reachable through the AWS CLI, including `aws pinpoint`
    mode: local-stdio
    install: uvx awslabs.aws-api-mcp-server@latest
    package: https://pypi.org/project/awslabs.aws-api-mcp-server/
    version: 1.5.1
    published: '2026-08-10'
    auth: api-key
    verified: searched
    note: >-
      Generic first-party AWS server that executes AWS CLI commands under the caller's IAM
      credentials. It reaches Pinpoint incidentally because Pinpoint is in the CLI, not because AWS
      published a Pinpoint tool contract. A human must install and run it before any agent sees it.
tools_note: >-
  Candidate tools only. Each is derived from a real operationId in openapi/; none is published by
  AWS. Input schemas are the parameters + requestBody of the named operation in the linked spec.
