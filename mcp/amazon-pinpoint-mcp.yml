lifecycle_warning: >-
  Amazon Pinpoint reaches end of support on 2026-10-30 (see lifecycle/amazon-pinpoint-lifecycle.yml).
  Anyone considering building the candidate server above should target AWS End User Messaging or
  Amazon Connect outbound campaigns instead for the engagement surface.
